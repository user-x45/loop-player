<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ループ動画プレイヤー</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#f6f6f4;--card:#fff;--bd:#e4e3de;--track:#e9e8e4;--tx:#171716;--sub:#7b7a74;--ac:#0a84ff;--red:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101011;--card:#1a1a1c;--bd:#2a2a2d;--track:#2a2a2d;--tx:#eeeeec;--sub:#8c8b86;--ac:#4c9aff}}
:root[data-theme="dark"]{--bg:#101011;--card:#1a1a1c;--bd:#2a2a2d;--track:#2a2a2d;--tx:#eeeeec;--sub:#8c8b86;--ac:#4c9aff}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:620px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:clamp(28px,7vw,34px);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.lead{margin:0 0 28px;font-size:14px;line-height:1.7;color:var(--sub)}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:16px}
.lab{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:600;color:var(--sub);margin:28px 2px 10px}
.lab em{font-style:normal;font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
#drop{padding:26px 20px;text-align:center;cursor:pointer;border-style:dashed;transition:border-color .2s}
#drop:hover,#drop.on{border-color:var(--ac)}
.ico{width:40px;height:40px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,transparent)}
.ico i{color:var(--ac);font-size:16px}
#drop strong{display:block;font-size:15px;font-weight:600;margin-bottom:3px}
#drop span{font-size:12.5px;color:var(--sub)}
#list{list-style:none;margin:0;padding:0;overflow:hidden}
#empty{padding:22px;text-align:center;font-size:13px;color:var(--sub)}
li.it{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px}
li.it+li.it{border-top:1px solid var(--bd)}
li.it.drag{opacity:.35}
li.it.over{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.num{font-size:12px;font-weight:600;color:var(--sub);width:18px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.th{position:relative;width:100px;height:56px;border-radius:8px;overflow:hidden;background:#1c1c1e;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.ph{background:linear-gradient(110deg,#1c1c1e 30%,#2c2c30 50%,#1c1c1e 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.meta{flex:1;min-width:0}
.n{font-size:14px;font-weight:500;line-height:1.45;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d{font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.bt{display:flex;gap:2px;flex:none}
.bt button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--sub);font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.bt button:hover{background:var(--track);color:var(--tx)}
.bt button[data-a="x"]:hover{color:var(--red)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--track);border:0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.seg .pill{cursor:grab;position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:translate .3s cubic-bezier(.3,1,.4,1),scale .2s}
.seg[data-m="1"] .pill{translate:100% 0}
.seg.hold .pill{scale:1.03 1.06;cursor:grabbing}
.seg button{position:relative;z-index:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;font-weight:600;padding:11px 0;cursor:pointer;transition:color .2s}
.seg button.on{color:var(--tx)}
.seg button i{margin-right:8px;font-size:12px}
.opt{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt .ot{display:flex;flex-direction:column;gap:4px;min-width:0}
.opt b{font-weight:600;font-size:14px}
.opt b i{width:22px;color:var(--sub);margin-right:4px}
.opt small{font-size:11.5px;line-height:1.6;color:var(--sub);font-weight:400;padding-left:26px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.sw{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:var(--track);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.opt input:checked+.sw{background:var(--ac)}
.opt input:checked+.sw::after{transform:translateX(18px)}
#play{margin-top:12px;width:100%;padding:16px 20px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:filter .15s,opacity .2s}
#play i{font-size:14px}
#play:hover:not(:disabled){filter:brightness(1.08)}
#play:active:not(:disabled){filter:brightness(.95)}
#play:disabled{opacity:.4;cursor:default}
.how{margin-top:28px;padding:16px 18px;display:grid;gap:10px;font-size:12.5px;color:var(--sub);line-height:1.7}
.how .row{display:flex;align-items:center;gap:12px}
.key{flex:none;min-width:100px;text-align:center;font-size:12px;font-weight:600;color:var(--tx);padding:5px 10px;border-radius:8px;background:var(--track)}
.fine{font-size:11.5px;padding-top:10px;border-top:1px solid var(--bd)}
#stage{position:fixed;inset:0;background:#000;display:none;z-index:99;cursor:none;user-select:none;-webkit-user-select:none;touch-action:none}
#stage.show{display:block}
#stage video{width:100%;height:100%;object-fit:contain;pointer-events:none;background:#000}
#hint{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:rgba(30,30,30,.85);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;white-space:nowrap}
#bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:#fff}
@media (max-width:480px){.th{width:88px;height:50px}.num{display:none}.key{min-width:92px}}
</style>
</head>
<body>
<main>
<h1>ループ再生</h1>
<p class="lead">動画を並べて、全画面で順番に、またはシャッフルで再生します。再生中はキーボードをロックします。</p>

<div id="drop" class="glass">
  <div class="ico"><i class="fa-solid fa-plus"></i></div>
  <strong>動画を追加</strong>
  <span>タップして選択、またはドロップ（複数可）</span>
  <input id="file" type="file" accept="video/*" multiple hidden>
</div>

<div class="lab"><span>プレイリスト</span><em id="sum"></em></div>
<ul id="list" class="glass"></ul>

<div class="lab"><span>再生</span></div>
<div class="seg glass" id="seg" data-m="0"><i class="pill"></i><button data-m="0" class="on"><i class="fa-solid fa-repeat"></i>順番に再生</button><button data-m="1"><i class="fa-solid fa-shuffle"></i>シャッフル</button></div>
<label class="opt glass"><span class="ot"><b><i class="fa-solid fa-volume-high"></i>音量を自動で揃える</b><small>動画ごとの音量差や、1本の動画の中の大小を自動で補正し、急に音が大きくなったり小さくなったりするのを抑えます。</small></span><input type="checkbox" id="norm" checked><i class="sw"></i></label>
<button id="play" disabled><i class="fa-solid fa-play"></i>全画面で再生</button>

<div class="how glass">
  <div class="row"><span class="key">画面を長押し</span><span>約1.5秒で解除</span></div>
  <div class="row"><span class="key">Esc を長押し</span><span>約1.5秒で解除</span></div>
  <div class="fine">長押し中は画面下に進捗バーが出ます。キーボードロックは Chrome / Edge（デスクトップ）で有効です。動画は端末内で処理され、アップロードされません。</div>
</div>
</main>

<div id="stage"><video id="v" playsinline></video><div id="hint"></div><div id="bar"></div></div>

<script>
const HOLD=1500;
const items=[];let order=[],pos=0,shuffle=false,playing=false,fails=0,pressT=0,escT=0,barRaf=0,hintT=0,dragIdx=null;
const $=id=>document.getElementById(id);
const list=$('list'),play=$('play'),stage=$('stage'),v=$('v'),hint=$('hint'),bar=$('bar'),drop=$('drop'),file=$('file'),sum=$('sum'),seg=$('seg');
const normEl=$('norm');

drop.onclick=()=>file.click();
file.onchange=()=>{add(file.files);file.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');add(e.dataTransfer.files)};

const segBtns=[...seg.querySelectorAll('button')],pill=seg.querySelector('.pill');
let dragged=false;
function setMode(m){
  shuffle=m===1;
  seg.dataset.m=String(m);
  segBtns.forEach((x,i)=>x.classList.toggle('on',i===m));
}
segBtns.forEach((b,i)=>b.onclick=()=>{if(dragged){dragged=false;return}setMode(i)});
let sx=0,sm=0,sw=0,drag=false,down=false;
seg.addEventListener('pointerdown',e=>{
  down=true;drag=false;sx=e.clientX;sm=shuffle?1:0;
  seg.classList.add('hold');
  sw=pill.getBoundingClientRect().width;
});
seg.addEventListener('pointermove',e=>{
  if(!down)return;
  const dx=e.clientX-sx;
  if(!drag){
    if(Math.abs(dx)<5)return;
    drag=true;dragged=true;
    pill.style.transitionProperty='scale,background,box-shadow,backdrop-filter';
    try{seg.setPointerCapture(e.pointerId)}catch(err){}
  }
  const val=Math.max(0,Math.min(sw,sm*sw+dx));
  pill.style.translate=`${val}px 0`;
  segBtns.forEach((x,i)=>x.classList.toggle('on',i===(val>sw/2?1:0)));
});
function endDrag(e){
  seg.classList.remove('hold');
  if(!down)return;
  down=false;
  if(!drag)return;
  const dx=e.clientX-sx;
  const val=Math.max(0,Math.min(sw,sm*sw+dx));
  pill.style.transitionProperty='';
  setMode(val>sw/2?1:0);
  pill.style.translate='';
  setTimeout(()=>{dragged=false},0);
}
seg.addEventListener('pointerup',endDrag);
seg.addEventListener('pointercancel',endDrag);
window.addEventListener('pointerup',()=>seg.classList.remove('hold'));

function fmt(s){if(!isFinite(s))return'';s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')}

function add(fs){
  [...fs].filter(f=>f.type.startsWith('video/')).forEach(f=>{
    const it={name:f.name,file:f,url:URL.createObjectURL(f),thumb:'',dur:0,done:false,gain:1,db:0,an:0};
    items.push(it);thumbFor(it);enqueue(it);
  });
  render();
}

function thumbFor(it){
  const t=document.createElement('video');
  t.muted=true;t.defaultMuted=true;t.playsInline=true;t.preload='auto';
  t.setAttribute('muted','');t.setAttribute('playsinline','');
  t.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  document.body.appendChild(t);
  let done=false,to=0;
  const finish=()=>{
    if(done)return;done=true;clearTimeout(to);
    t.removeAttribute('src');t.load();t.remove();
    it.done=true;render();
  };
  const snap=()=>{
    if(done)return;
    try{
      const w=t.videoWidth||224,h=t.videoHeight||126;
      const c=document.createElement('canvas');c.width=224;c.height=Math.round(224*h/w)||126;
      c.getContext('2d').drawImage(t,0,0,c.width,c.height);
      it.thumb=c.toDataURL('image/jpeg',.72);
    }catch(e){}
    finish();
  };
  t.onloadedmetadata=()=>{if(isFinite(t.duration)){it.dur=t.duration;render()}};
  t.onloadeddata=()=>{
    const d=t.duration;
    if(isFinite(d)&&d>0){try{t.currentTime=Math.min(1,d/2)}catch(e){snap()}}
    else snap();
  };
  t.onseeked=snap;
  t.onerror=finish;
  to=setTimeout(snap,5000);
  t.src=it.url;
  t.load();
}

function move(i,d){const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}

function render(){
  list.innerHTML='';
  if(!items.length)list.innerHTML='<div id="empty">まだ動画がありません</div>';
  items.forEach((it,i)=>{
    const li=document.createElement('li');li.className='it';li.draggable=true;
    li.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><div class="th ${it.thumb||it.done?'':'ph'}">${it.thumb?'<img alt="">':''}</div><div class="meta"><div class="n"></div><div class="d">${metaText(it)}</div></div><div class="bt"><button data-a="u" aria-label="上へ"><i class="fa-solid fa-chevron-up"></i></button><button data-a="d" aria-label="下へ"><i class="fa-solid fa-chevron-down"></i></button><button data-a="x" aria-label="削除"><i class="fa-solid fa-xmark"></i></button></div>`;
    if(it.thumb)li.querySelector('img').src=it.thumb;
    li.querySelector('.n').textContent=it.name;
    li.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='u')move(i,-1);else if(a==='d')move(i,1);else{URL.revokeObjectURL(it.url);items.splice(i,1);render()}
    });
    li.ondragstart=e=>{dragIdx=i;li.classList.add('drag');e.dataTransfer.effectAllowed='move'};
    li.ondragend=()=>{li.classList.remove('drag');dragIdx=null;list.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))};
    li.ondragover=e=>{e.preventDefault();li.classList.add('over')};
    li.ondragleave=()=>li.classList.remove('over');
    li.ondrop=e=>{
      e.preventDefault();
      if(dragIdx===null||dragIdx===i)return;
      const [m]=items.splice(dragIdx,1);items.splice(i,0,m);dragIdx=null;render();
    };
    list.appendChild(li);
  });
  const tot=items.reduce((a,b)=>a+(b.dur||0),0);
  sum.textContent=items.length?`${items.length}本${tot?' · '+fmt(tot):''}`:'';
  const busy=items.some(i=>i.an<2);
  play.disabled=!items.length||busy;
  play.innerHTML=busy?`<i class="fa-solid fa-spinner fa-spin"></i>解析中… ${items.filter(i=>i.an>=2).length}/${items.length}`:'<i class="fa-solid fa-play"></i>全画面で再生';
}
render();

function metaText(it){
  const a=[];
  if(it.dur)a.push(fmt(it.dur));
  if(it.an===1)a.push('音量を解析中…');
  else if(it.an===2)a.push(`<i class="fa-solid fa-volume-high"></i> ${it.db>0?'+':''}${it.db.toFixed(1)} dB 平均`);
  else if(it.an===3)a.push('音量は未解析');
  return a.length?a.join(' · '):'&nbsp;';
}

let aq=Promise.resolve();
function enqueue(it){aq=aq.then(()=>analyze(it)).catch(()=>{})}
async function analyze(it){
  if(!items.includes(it))return;
  it.an=1;render();
  try{
    if(it.file.size>600*1024*1024)throw new Error('large');
    const buf=await it.file.arrayBuffer();
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const oc=new OAC(1,16000,16000);
    const ab=await Promise.race([oc.decodeAudioData(buf),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),90000))]);
    const n=ab.length,ch=ab.numberOfChannels,blk=1600;
    const data=[];
    for(let c=0;c<ch;c++)data.push(ab.getChannelData(c));
    const pw=[];let peak=0;
    for(let i=0;i<n;i+=blk){
      const e=Math.min(n,i+blk);let sum=0;
      for(let c=0;c<ch;c++){
        const d=data[c];
        for(let j=i;j<e;j++){const x=d[j];sum+=x*x;const a=x<0?-x:x;if(a>peak)peak=a}
      }
      pw.push(sum/((e-i)*ch));
    }
    const H=pw.length,dd=new Array(H);
    for(let i=0;i<H;i++){
      const lo=Math.max(0,i-2),hi=Math.min(H-1,i+1);
      let m=0;
      for(let k=lo;k<=hi;k++)m+=pw[k];
      m/=(hi-lo+1);
      dd[i]=m>1e-5?Math.max(-18,Math.min(18,-20-10*Math.log10(m))):NaN;
    }
    let last=NaN;
    for(let i=0;i<H;i++){if(!isNaN(dd[i]))last=dd[i];else if(!isNaN(last))dd[i]=last}
    let nxt=NaN;
    for(let i=H-1;i>=0;i--){if(!isNaN(dd[i]))nxt=dd[i];else if(!isNaN(nxt))dd[i]=nxt}
    if(!H||isNaN(dd[0])){it.gain=1;it.db=0;it.env=null;it.an=2;render();return}
    const mn=new Array(H);
    for(let i=0;i<H;i++){
      let low=Infinity;
      for(let k=Math.max(0,i-6);k<=Math.min(H-1,i+6);k++)if(dd[k]<low)low=dd[k];
      mn[i]=low;
    }
    const env=new Float32Array(H+1);
    let tot=0;
    for(let i=0;i<H;i++){
      const lo=Math.max(0,i-4),hi=Math.min(H-1,i+4);
      let m=0;
      for(let k=lo;k<=hi;k++)m+=mn[k];
      m/=(hi-lo+1);
      env[i]=Math.pow(10,m/20);
      tot+=m;
    }
    env[H]=env[H-1];
    it.env=env;it.db=tot/H;it.gain=Math.pow(10,it.db/20);it.an=2;
  }catch(err){
    it.gain=1;it.db=0;it.an=3;
  }
  render();
  if(playing&&items[order[pos]]===it)applyGain();
}

let actx=null,gnode=null;
function initAudio(){
  if(actx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  actx=new AC();
  const src=actx.createMediaElementSource(v);
  gnode=actx.createGain();
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-3;comp.knee.value=3;comp.ratio.value=20;comp.attack.value=.002;comp.release.value=.12;
  src.connect(gnode);gnode.connect(comp);comp.connect(actx.destination);
}
function gainAt(it){
  if(!normEl.checked||!it)return 1;
  if(it.env){
    const p=v.currentTime*10,i0=Math.floor(p);
    const i=Math.min(it.env.length-1,i0),j=Math.min(it.env.length-1,i0+1);
    const f=p-i0;
    return it.env[i]*(1-f)+it.env[j]*f;
  }
  return it.gain;
}
let gainT=0;
function applyGain(){
  if(!gnode)return;
  gnode.gain.setTargetAtTime(gainAt(items[order[pos]]),actx.currentTime,.04);
}
normEl.onchange=applyGain;

let wake=null;
async function lockWake(){
  if(!navigator.wakeLock)return;
  try{
    const w=await navigator.wakeLock.request('screen');
    wake=w;
    w.addEventListener('release',()=>{if(wake===w)wake=null});
  }catch(e){}
}
function unlockWake(){
  if(wake){const w=wake;wake=null;w.release().catch(()=>{})}
}
document.addEventListener('visibilitychange',()=>{
  if(playing&&document.visibilityState==='visible'&&!wake)lockWake();
});

function buildOrder(last){
  order=items.map((_,i)=>i);
  if(shuffle){
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
    if(order.length>1&&order[0]===last){const k=1+Math.floor(Math.random()*(order.length-1));[order[0],order[k]]=[order[k],order[0]]}
  }
  pos=0;
}
function loadCur(){v.src=items[order[pos]].url;applyGain();v.play().catch(()=>{})}
v.onended=()=>{
  const last=order[pos];pos++;
  if(pos>=order.length)buildOrder(last);
  loadCur();
};
v.onplaying=()=>{fails=0};
v.onerror=()=>{if(!playing)return;if(++fails>items.length)return;v.onended()};

play.onclick=async()=>{
  if(!items.length)return;
  try{initAudio();if(actx.state==='suspended')actx.resume()}catch(e){}
  clearInterval(gainT);gainT=setInterval(applyGain,50);
  lockWake();
  fails=0;buildOrder(-1);playing=true;stage.classList.add('show');
  try{await stage.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{if(navigator.keyboard&&navigator.keyboard.lock)await navigator.keyboard.lock()}catch(e){}
  loadCur();
  hint.textContent='画面または Esc を長押しで解除';hint.style.display='block';
  clearTimeout(hintT);hintT=setTimeout(()=>{hint.style.display='none'},3500);
};

function stopAll(){
  playing=false;clearInterval(gainT);unlockWake();clearTimeout(pressT);clearTimeout(escT);clearTimeout(hintT);
  cancelAnimationFrame(barRaf);bar.style.width='0';
  v.pause();v.removeAttribute('src');v.load();
  stage.classList.remove('show');hint.style.display='none';
  try{navigator.keyboard&&navigator.keyboard.unlock()}catch(e){}
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{if(playing&&!document.fullscreenElement)stopAll()});

function prog(ms){
  const t0=performance.now();cancelAnimationFrame(barRaf);
  const tick=()=>{bar.style.width=Math.min(100,(performance.now()-t0)/ms*100)+'%';barRaf=requestAnimationFrame(tick)};
  tick();
}
function endProg(){cancelAnimationFrame(barRaf);bar.style.width='0'}

stage.addEventListener('pointerdown',e=>{
  if(!playing)return;
  e.preventDefault();clearTimeout(pressT);pressT=setTimeout(stopAll,HOLD);prog(HOLD);
});
['pointerup','pointercancel','pointerleave'].forEach(n=>stage.addEventListener(n,()=>{clearTimeout(pressT);endProg()}));
stage.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(!playing)return;
  e.preventDefault();e.stopPropagation();
  if(e.code==='Escape'&&!e.repeat){prog(HOLD);escT=setTimeout(stopAll,HOLD)}
},true);
window.addEventListener('keyup',e=>{
  if(!playing)return;
  e.preventDefault();
  if(e.code==='Escape'){clearTimeout(escT);endProg()}
},true);
window.addEventListener('beforeunload',e=>{if(playing){e.preventDefault();e.returnValue=''}});
</script>
