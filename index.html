<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ループ動画プレイヤー</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--bd:#e4e4df;--tx:#1a1a18;--sub:#77776f;--ac:#2f6df6;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121213;--card:#1b1b1d;--bd:#2c2c2f;--tx:#ececea;--sub:#8e8e88;--ac:#6b97ff;--on:#0b0b0c}}
:root[data-theme="dark"]{--bg:#121213;--card:#1b1b1d;--bd:#2c2c2f;--tx:#ececea;--sub:#8e8e88;--ac:#6b97ff;--on:#0b0b0c}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.lead{color:var(--sub);font-size:14px;line-height:1.7;margin:0 0 24px}
#drop{border:1.5px dashed var(--bd);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--card);transition:.2s}
#drop:hover,#drop.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,var(--card))}
#drop svg{width:26px;height:26px;stroke:var(--ac);fill:none;stroke-width:1.6;margin-bottom:6px}
#drop strong{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
#drop span{font-size:12px;color:var(--sub)}
.head{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 10px}
.head h2{font-size:13px;font-weight:600;margin:0;color:var(--sub);letter-spacing:.04em}
#sum{font-size:12px;color:var(--sub)}
#list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#empty{border:1px solid var(--bd);border-radius:12px;padding:22px;text-align:center;font-size:13px;color:var(--sub);background:var(--card)}
li.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px 8px 14px;transition:border-color .15s}
li.it:hover{border-color:var(--ac)}
li.it.drag{opacity:.35}
.num{font-size:13px;color:var(--sub);width:14px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.th{position:relative;width:104px;height:58px;border-radius:8px;overflow:hidden;background:#1a1a1a;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.ph{background:linear-gradient(110deg,#222 30%,#303030 50%,#222 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.th b{position:absolute;right:4px;bottom:4px;font-weight:500;font-size:10px;color:#fff;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:5px;font-variant-numeric:tabular-nums}
.n{flex:1;min-width:0;font-size:13.5px;line-height:1.5;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt{display:flex;gap:4px;flex:none}
.bt button{width:30px;height:30px;border:0;background:transparent;color:var(--sub);border-radius:8px;font-size:14px;cursor:pointer;transition:.15s}
.bt button:hover{background:var(--bg);color:var(--tx)}
#play{margin-top:20px;width:100%;padding:15px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
#play svg{width:14px;height:14px;fill:currentColor}
#play:hover:not(:disabled){filter:brightness(1.08)}
#play:disabled{opacity:.35;cursor:default}
.how{margin-top:22px;font-size:12.5px;color:var(--sub);line-height:1.9}
.how b{color:var(--tx);font-weight:600}
.how .fine{font-size:11.5px;margin-top:6px;opacity:.85;line-height:1.7}
#stage{position:fixed;inset:0;background:#000;display:none;z-index:99;cursor:none;user-select:none;-webkit-user-select:none;touch-action:none}
#stage.show{display:block}
#stage video{width:100%;height:100%;object-fit:contain;pointer-events:none;background:#000}
#hint{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:rgba(20,20,20,.72);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;white-space:nowrap}
#bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:#fff}
@media (max-width:480px){.th{width:88px;height:50px}.num{display:none}li.it{padding-left:10px}}
</style>
</head>
<body>
<main>
<h1>ループ動画プレイヤー</h1>
<p class="lead">動画を並べて、全画面で順番にループ再生します。再生中はキーボードをロックします。</p>

<div id="drop">
  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
  <strong>動画を追加</strong>
  <span>タップして選択、またはドロップ（複数可）</span>
  <input id="file" type="file" accept="videofunction loadCur(){v.src=items[cur].url;v.play().catch(()=>{})}
v.onended=()=>{cur=(cur+1)%items.length;loadCur()};

play.onclick=async()=>{
  if(!items.length)return;
  cur=0;playing=true;stage.classList.add('show');
  try{await stage.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{if(navigator.keyboard&&navigator.keyboard.lock)await navigator.keyboard.lock()}catch(e){}
  loadCur();
  hint.textContent='画面または Esc を長押しで解除';hint.style.display='block';
  clearTimeout(hintT);hintT=setTimeout(()=>{hint.style.display='none'},3500);
};
function stopAll(){
  playing=false;clearTimeout(pressT);clearTimeout(escT);clearTimeout(hintT);
  cancelAnimationFrame(barRaf);bar.style.width='0';
  v.pause();v.removeAttribute('src');v.load();
  stage.classList.remove('show');hint.style.display='none';
  try{navigator.keyboard&&navigator.keyboard.unlock()}catch(e){}
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{if(playing&&!document.fullscreenElement)stopAll()});

function prog(){const t0=performance.now();cancelAnimationFrame(barRaf);const tick=()=>{bar.style.width=Math.min(100,(performance.now()-t0)/15)+'%';barRaf=requestAnimationFrame(tick)};tick()}
function endProg(){cancelAnimationFrame(barRaf);bar.style.width='0'}
stage.addEventListener('pointerdown',e=>{if(!playing)return;e.preventDefault();clearTimeout(pressT);pressT=setTimeout(stopAll,1500);prog()});
['pointerup','pointercancel','pointerleave'].forEach(n=>stage.addEventListener(n,()=>{clearTimeout(pressT);endProg()}));
stage.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(!playing)return;
  e.preventDefault();e.stopPropagation();
  if(e.code==='Escape'&&!e.repeat){prog();escT=setTimeout(stopAll,1500)}
},true);
window.addEventListener('keyup',e=>{
  if(!playing)return;
  e.preventDefault();
  if(e.code==='Escape'){clearTimeout(escT);endProg()}
},true);
window.addEventListener('beforeunload',e=>{if(playing){e.preventDefault();e.returnValue=''}});
</script>
</body>
</html>
