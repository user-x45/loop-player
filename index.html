<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ループ動画プレイヤー</title>
<style>
:root{--tx:#101114;--sub:rgba(60,60,67,.62);--glass:rgba(255,255,255,.4);--gb:rgba(255,255,255,.7);--hl:rgba(255,255,255,.9);--lo:rgba(255,255,255,.12);--sh:rgba(40,60,130,.16);--sep:rgba(60,60,67,.14);--pill:rgba(255,255,255,.85);--ac:#0a84ff;--red:#ff453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#fff;--sub:rgba(235,235,245,.56);--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.16);--hl:rgba(255,255,255,.28);--lo:rgba(255,255,255,.04);--sh:rgba(0,0,0,.5);--sep:rgba(255,255,255,.1);--pill:rgba(255,255,255,.2)}}
:root[data-theme="dark"]{--tx:#fff;--sub:rgba(235,235,245,.56);--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.16);--hl:rgba(255,255,255,.28);--lo:rgba(255,255,255,.04);--sh:rgba(0,0,0,.5);--sep:rgba(255,255,255,.1);--pill:rgba(255,255,255,.2)}
*{box-sizing:border-box}
html{background:linear-gradient(160deg,#dce8ff,#f1e4ff 55%,#ffe4ee);background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) html,html{background:linear-gradient(160deg,#060814,#0d0a1f 60%,#140a16);background-attachment:fixed}}
body{margin:0;min-height:100vh;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(42vmax 42vmax at 12% 8%,rgba(10,132,255,.5),transparent 62%),radial-gradient(36vmax 36vmax at 92% 28%,rgba(191,90,242,.42),transparent 62%),radial-gradient(42vmax 42vmax at 28% 98%,rgba(255,159,10,.36),transparent 62%)}
main{max-width:640px;margin:0 auto;padding:36px 18px 64px}
h1{font-size:clamp(34px,9vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:0 4px 8px}
.lead{margin:0 4px 26px;font-size:14px;line-height:1.7;color:var(--sub)}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(26px) saturate(185%);-webkit-backdrop-filter:blur(26px) saturate(185%);border:1px solid var(--gb);border-radius:28px;box-shadow:inset 0 1.5px 0 var(--hl),inset 0 -1px 0 var(--lo),0 14px 38px -14px var(--sh)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.3),transparent 38%)}
.glass>*{position:relative}
.lab{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:600;color:var(--sub);margin:26px 8px 10px}
.lab em{font-style:normal;font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
#drop{padding:26px 20px;text-align:center;cursor:pointer;transition:transform .25s cubic-bezier(.3,.8,.3,1),box-shadow .25s}
#drop:hover,#drop.on{transform:scale(1.012);box-shadow:inset 0 1.5px 0 var(--hl),inset 0 -1px 0 var(--lo),0 0 0 3px rgba(10,132,255,.45),0 14px 38px -14px var(--sh)}
.ico{width:46px;height:46px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,rgba(10,132,255,.9),rgba(0,98,224,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -6px rgba(10,132,255,.7)}
.ico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
#drop strong{display:block;font-size:16px;font-weight:600;margin-bottom:3px}
#drop span{font-size:12.5px;color:var(--sub)}
#list{list-style:none;margin:0;padding:4px 0;overflow:hidden}
#empty{padding:22px;text-align:center;font-size:13px;color:var(--sub)}
li.it{position:relative;display:flex;align-items:center;gap:13px;padding:11px 14px 11px 16px}
li.it+li.it::after{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--sep)}
li.it.drag{opacity:.35}
li.it.over{background:rgba(10,132,255,.14)}
.num{font-size:12px;font-weight:600;color:var(--sub);width:18px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.th{position:relative;width:104px;height:59px;border-radius:14px;overflow:hidden;background:#1c1c1e;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 8px 18px -8px rgba(0,0,0,.5)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.ph{background:linear-gradient(110deg,#1c1c1e 30%,#2c2c30 50%,#1c1c1e 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.meta{flex:1;min-width:0}
.n{font-size:14px;font-weight:500;line-height:1.45;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d{font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.bt{display:flex;gap:4px;flex:none}
.bt button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--sub);font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.bt button:hover{background:var(--pill);color:var(--tx)}
.bt button[data-a="x"]:hover{color:var(--red)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.seg .pill{cursor:grab;position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--pill);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px -3px rgba(0,0,0,.2);transition:transform .45s cubic-bezier(.3,1.25,.4,1),scale .35s cubic-bezier(.3,1.3,.4,1),background .3s,box-shadow .3s,backdrop-filter .3s}
.seg{transition:scale .35s cubic-bezier(.3,1.3,.4,1)}
.seg.hold{scale:1.035}
.seg.hold .pill{scale:1.2 1.34;cursor:grabbing;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(1.5px) saturate(190%) brightness(1.18);backdrop-filter:blur(1.5px) saturate(190%) brightness(1.18);box-shadow:inset 0 0 0 1px rgba(0,0,0,.32),inset 3px 0 4px -1px rgba(255,90,90,.45),inset -3px 0 4px -1px rgba(90,170,255,.5),inset 0 7px 10px -7px rgba(255,255,255,.7),inset 0 -7px 10px -7px rgba(255,255,255,.35),0 10px 24px -6px rgba(0,0,0,.4)}
.seg button{transition:color .2s,opacity .2s}
.seg[data-m="1"] .pill{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;font-weight:600;padding:12px 0;cursor:pointer}
.seg button.on{color:var(--tx)}
#play{margin-top:12px;width:100%;padding:18px 20px;border:1px solid rgba(255,255,255,.4);border-radius:999px;color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,rgba(64,160,255,.95),rgba(0,104,230,.95));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.12),0 16px 30px -10px rgba(10,132,255,.75);transition:transform .25s cubic-bezier(.3,.8,.3,1),opacity .2s}
#play svg{width:14px;height:14px;fill:currentColor}
#play:hover:not(:disabled){transform:translateY(-2px) scale(1.01)}
#play:active:not(:disabled){transform:scale(.98)}
#play:disabled{opacity:.4;cursor:default}
.how{margin-top:26px;padding:16px 18px;display:grid;gap:11px;font-size:12.5px;color:var(--sub);line-height:1.7}
.how .row{display:flex;align-items:center;gap:12px}
.key{flex:none;min-width:100px;text-align:center;font-size:12px;font-weight:600;color:var(--tx);padding:6px 12px;border-radius:999px;background:var(--pill);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.fine{font-size:11.5px;padding-top:10px;border-top:1px solid var(--sep)}
#stage{position:fixed;inset:0;background:#000;display:none;z-index:99;cursor:none;user-select:none;-webkit-user-select:none;touch-action:none}
#stage.show{display:block}
#stage video{width:100%;height:100%;object-fit:contain;pointer-events:none;background:#000}
#hint{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:rgba(255,255,255,.16);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;display:none;white-space:nowrap}
#bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:linear-gradient(90deg,#5ac8fa,#fff);box-shadow:0 0 14px rgba(90,200,250,.9)}
@media (max-width:480px){.th{width:88px;height:50px}.num{display:none}.key{min-width:92px}}
</style>
</head>
<body>
<main>
<h1>ループ再生</h1>
<p class="lead">動画を並べて、全画面で順番に、またはシャッフルで再生します。再生中はキーボードをロックします。</p>

<div id="drop" class="glass">
  <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  <strong>動画を追加</strong>
  <span>タップして選択、またはドロップ（複数可）</span>
  <input id="file" type="file" accept="video/*" multiple hidden>
</div>

<div class="lab"><span>プレイリスト</span><em id="sum"></em></div>
<ul id="list" class="glass"></ul>

<div class="lab"><span>再生</span></div>
<div class="seg glass" id="seg" data-m="0"><i class="pill"></i><button data-m="0" class="on">順番に再生</button><button data-m="1">シャッフル</button></div>
<button id="play" disabled><svg viewBox="0 0 16 16"><path d="M3 1.8v12.4a.5.5 0 0 0 .76.43l10.2-6.2a.5.5 0 0 0 0-.86L3.76 1.37A.5.5 0 0 0 3 1.8z"/></svg>全画面で再生</button>

<div class="how glass">
  <div class="row"><span class="key">画面を長押し</span><span>約1.5秒で解除</span></div>
  <div class="row"><span class="key">Esc を長押し</span><span>約1.5秒で解除</span></div>
  <div class="fine">長押し中は画面下に進捗バーが出ます。キーボードロックは Chrome / Edge（デスクトップ）で有効です。動画は端末内で処理され、アップロードされません。</div>
</div>
</main>

<div id="stage"><video id="v" playsinline></video><div id="hint"></div><div id="bar"></div></div>

<script>
const items=[];let order=[],pos=0,shuffle=false,playing=false,fails=0,pressT=0,escT=0,barRaf=0,hintT=0,dragIdx=null;
const $=id=>document.getElementById(id);
const list=$('list'),play=$('play'),stage=$('stage'),v=$('v'),hint=$('hint'),bar=$('bar'),drop=$('drop'),file=$('file'),sum=$('sum'),seg=$('seg');

drop.onclick=()=>file.click();
file.onchange=()=>{add(file.files);file.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');add(e.dataTransfer.files)};

const segBtns=[...seg.querySelectorAll('button')],pill=seg.querySelector('.pill');
let dragged=false;
function setMode(m){
  shuffle=m===1;
  seg.dataset.m=String(m);
  segBtns.forEach((x,i)=>x.classList.toggle('on',i===m));
}
segBtns.forEach((b,i)=>b.onclick=()=>{if(dragged){dragged=false;return}setMode(i)});
let sx=0,sm=0,sw=0,drag=false,down=false;
seg.addEventListener('pointerdown',e=>{
  down=true;drag=false;sx=e.clientX;sm=shuffle?1:0;
  seg.classList.add('hold');
  sw=pill.getBoundingClientRect().width;
});
seg.addEventListener('pointermove',e=>{
  if(!down)return;
  const dx=e.clientX-sx;
  if(!drag){
    if(Math.abs(dx)<5)return;
    drag=true;dragged=true;
    pill.style.transitionProperty='scale,background,box-shadow,backdrop-filter';
    try{seg.setPointerCapture(e.pointerId)}catch(err){}
  }
  const val=Math.max(0,Math.min(sw,sm*sw+dx));
  pill.style.transform=`translateX(${val}px)`;
  segBtns.forEach((x,i)=>x.classList.toggle('on',i===(val>sw/2?1:0)));
});
function endDrag(e){
  seg.classList.remove('hold');
  if(!down)return;
  down=false;
  if(!drag)return;
  const dx=e.clientX-sx;
  const val=Math.max(0,Math.min(sw,sm*sw+dx));
  pill.style.transitionProperty='';
  setMode(val>sw/2?1:0);
  pill.style.transform='';
  setTimeout(()=>{dragged=false},0);
}
seg.addEventListener('pointerup',endDrag);
seg.addEventListener('pointercancel',endDrag);
window.addEventListener('pointerup',()=>seg.classList.remove('hold'));

function fmt(s){if(!isFinite(s))return'';s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')}

function add(fs){
  [...fs].filter(f=>f.type.startsWith('video/')).forEach(f=>{
    const it={name:f.name,url:URL.createObjectURL(f),thumb:'',dur:0,done:false};
    items.push(it);thumbFor(it);
  });
  render();
}

function thumbFor(it){
  const t=document.createElement('video');
  t.muted=true;t.defaultMuted=true;t.playsInline=true;t.preload='auto';
  t.setAttribute('muted','');t.setAttribute('playsinline','');
  t.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  document.body.appendChild(t);
  let done=false,to=0;
  const finish=()=>{
    if(done)return;done=true;clearTimeout(to);
    t.removeAttribute('src');t.load();t.remove();
    it.done=true;render();
  };
  const snap=()=>{
    if(done)return;
    try{
      const w=t.videoWidth||224,h=t.videoHeight||126;
      const c=document.createElement('canvas');c.width=224;c.height=Math.round(224*h/w)||126;
      c.getContext('2d').drawImage(t,0,0,c.width,c.height);
      it.thumb=c.toDataURL('image/jpeg',.72);
    }catch(e){}
    finish();
  };
  t.onloadedmetadata=()=>{if(isFinite(t.duration)){it.dur=t.duration;render()}};
  t.onloadeddata=()=>{
    const d=t.duration;
    if(isFinite(d)&&d>0){try{t.currentTime=Math.min(1,d/2)}catch(e){snap()}}
    else snap();
  };
  t.onseeked=snap;
  t.onerror=finish;
  to=setTimeout(snap,5000);
  t.src=it.url;
  t.load();
}

function move(i,d){const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}

function render(){
  list.innerHTML='';
  if(!items.length)list.innerHTML='<div id="empty">まだ動画がありません</div>';
  items.forEach((it,i)=>{
    const li=document.createElement('li');li.className='it';li.draggable=true;
    li.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><div class="th ${it.thumb||it.done?'':'ph'}">${it.thumb?'<img alt="">':''}</div><div class="meta"><div class="n"></div><div class="d">${it.dur?fmt(it.dur):'&nbsp;'}</div></div><div class="bt"><button data-a="u" aria-label="上へ">↑</button><button data-a="d" aria-label="下へ">↓</button><button data-a="x" aria-label="削除">✕</button></div>`;
    if(it.thumb)li.querySelector('img').src=it.thumb;
    li.querySelector('.n').textContent=it.name;
    li.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='u')move(i,-1);else if(a==='d')move(i,1);else{URL.revokeObjectURL(it.url);items.splice(i,1);render()}
    });
    li.ondragstart=e=>{dragIdx=i;li.classList.add('drag');e.dataTransfer.effectAllowed='move'};
    li.ondragend=()=>{li.classList.remove('drag');dragIdx=null;list.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))};
    li.ondragover=e=>{e.preventDefault();li.classList.add('over')};
    li.ondragleave=()=>li.classList.remove('over');
    li.ondrop=e=>{
      e.preventDefault();
      if(dragIdx===null||dragIdx===i)return;
      const [m]=items.splice(dragIdx,1);items.splice(i,0,m);dragIdx=null;render();
    };
    list.appendChild(li);
  });
  const tot=items.reduce((a,b)=>a+(b.dur||0),0);
  sum.textContent=items.length?`${items.length}本${tot?' · '+fmt(tot):''}`:'';
  play.disabled=!items.length;
}
render();

function buildOrder(last){
  order=items.map((_,i)=>i);
  if(shuffle){
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
    if(order.length>1&&order[0]===last){const k=1+Math.floor(Math.random()*(order.length-1));[order[0],order[k]]=[order[k],order[0]]}
  }
  pos=0;
}
function loadCur(){v.src=items[order[pos]].url;v.play().catch(()=>{})}
v.onended=()=>{
  const last=order[pos];pos++;
  if(pos>=order.length)buildOrder(last);
  loadCur();
};
v.onplaying=()=>{fails=0};
v.onerror=()=>{if(!playing)return;if(++fails>items.length)return;v.onended()};

play.onclick=async()=>{
  if(!items.length)return;
  fails=0;buildOrder(-1);playing=true;stage.classList.add('show');
  try{await stage.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{if(navigator.keyboard&&navigator.keyboard.lock)await navigator.keyboard.lock()}catch(e){}
  loadCur();
  hint.textContent='画面または Esc を長押しで解除';hint.style.display='block';
  clearTimeout(hintT);hintT=setTimeout(()=>{hint.style.display='none'},3500);
};

function stopAll(){
  playing=false;clearTimeout(pressT);clearTimeout(escT);clearTimeout(hintT);
  cancelAnimationFrame(barRaf);bar.style.width='0';
  v.pause();v.removeAttribute('src');v.load();
  stage.classList.remove('show');hint.style.display='none';
  try{navigator.keyboard&&navigator.keyboard.unlock()}catch(e){}
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{if(playing&&!document.fullscreenElement)stopAll()});

function prog(){
  const t0=performance.now();cancelAnimationFrame(barRaf);
  const tick=()=>{bar.style.width=Math.min(100,(performance.now()-t0)/15)+'%';barRaf=requestAnimationFrame(tick)};
  tick();
}
function endProg(){cancelAnimationFrame(barRaf);bar.style.width='0'}

stage.addEventListener('pointerdown',e=>{
  if(!playing)return;
  e.preventDefault();clearTimeout(pressT);pressT=setTimeout(stopAll,1500);prog();
});
['pointerup','pointercancel','pointerleave'].forEach(n=>stage.addEventListener(n,()=>{clearTimeout(pressT);endProg()}));
stage.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(!playing)return;
  e.preventDefault();e.stopPropagation();
  if(e.code==='Escape'&&!e.repeat){prog();escT=setTimeout(stopAll,1500)}
},true);
window.addEventListener('keyup',e=>{
  if(!playing)return;
  e.preventDefault();
  if(e.code==='Escape'){clearTimeout(escT);endProg()}
},true);
window.addEventListener('beforeunload',e=>{if(playing){e.preventDefault();e.returnValue=''}});
</script>
</body>
</html>
